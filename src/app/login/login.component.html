
<div class="card mx-auto mt-5 p-3 " style="width: 18rem;">
  
  <div class="card-body">
    <h3 class="card-title">Login</h3>
    <div class="mb-3">
      <input type="email" class="form-control" [(ngModel)]="user.email"> 
      <input type="password" class="form-control mt-2" [(ngModel)]="user.password">  
    </div>
    <div class="text-center">
      <button class="btn btn-primary" (click)="login()">Submit</button>
    </div>
  </div>
</div>
