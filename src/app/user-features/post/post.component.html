<div class="card text-center w-75 mx-auto mt-3" *ngFor="let post of posts">
    <div class="text-start inline-block">
        <img src="../../../assets/images/téléchargement.jpg" alt="" class="w-25">
        <p>{{ post.user.firstName + " " + post.user.lastName }} <br> 
            <small>{{post.date | date}}</small>
        </p>
        
    </div>
    <div class="card-body">
        <p>{{post.content}}</p>
        <app-image [postId]="post.id" ></app-image>
    </div>
    <!-- <img class="card-img-top" src="" alt="Title"> -->
    <hr>
    <app-post-options [post]="post"></app-post-options>

</div>
