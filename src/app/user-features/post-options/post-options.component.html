<div class="btn-group">
    <button class="btn" (click)="addLike()">{{likesNumber.numberOfLikes}} Likes</button>
    <button class="btn" (click)="openComments()">
        {{comments.length + " Comments"}}
    </button>
    <button class="btn">0 Share</button>
</div>
<div *ngIf="commentll == true">
    <div class="d-flex mx-2 gap-1 my-4">
            <input type="text" class="form-control" placeholder="Add comment" [(ngModel)]="comment">
            <button class="btn btn-primary float-start ml-2" (click)="addComment()">
                Submit
            </button>
    </div>

    <ul *ngFor="let comment of comments" class="list-group-flush">

        <li class="list-group-item">
            <div>
                <img src="../../../assets/images/user.png" class="float-start comment-image" alt="">
                <span class="float-start fw-bold mt-2 ">{{comment.user.firstName +" "+
                    comment.post.user.lastName}}</span>
            </div><br>

            <p class="mt-3">
                {{comment.comment}}
            </p>
        </li>
    </ul>

</div>
